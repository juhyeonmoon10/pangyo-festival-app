<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'">
  <base href="../">
  <title>Festival map isolated preview</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ui-ver2.css">
  <link rel="stylesheet" href="web-redesign.css">
  <link rel="stylesheet" href="festival-bright.css">
</head>
<body class="design-ver2 design-web">
  <div id="app" class="app-shell"></div>
  <script>
    // Keep previews in memory and block all account and database requests.
    for (const key of ['localStorage', 'sessionStorage']) {
      const values = new Map();
      Object.defineProperty(window, key, { value: {
        getItem: name => values.get(name) ?? null,
        setItem: (name, value) => values.set(name, String(value)),
        removeItem: name => values.delete(name),
      } });
    }
    window.FestivalCatalog = { CLUB_IDS: {}, createClient: () => ({
      getSnapshot: () => ({ status: 'ready', rows: [] }),
      forClub: () => null, subscribe() {}, refresh() {},
    }) };
  </script>
  <script src="assets/vendor/ui-icons.js"></script>
  <script src="assets/vendor/qrcode-1.4.4.js"></script>
  <script src="nfc-manager.js"></script>
  <script src="programs.js"></script>
  <script src="web-experience.js"></script>
  <script src="operations-ui.js"></script>
  <script src="app.js"></script>
  <script>
    if (!isServerMode()) {
      const params = new URL(location.href).searchParams;
      state.floor = [1, 2, 3, 4].includes(Number(params.get('floor'))) ? Number(params.get('floor')) : 2;
      state.user = { ...state.db.users[0], id: 'map-ui-fixture', name: '테스트 학생', role: 'user' };
      state.db.users = [state.user];
      const booth = state.db.booths.find(b => b.floor === state.floor);
      if (booth) {
        if (params.has('long')) booth.name = '아주 긴 이름의 동아리와 함께하는 축제 프로그램';
        state.db.stamps = [{ id: 'fixture-stamp', userId: state.user.id, boothId: booth.id,
          status: 'active', method: 'nfc', createdAt: '2026-10-21T01:00:00Z' }];
        state.db.reviews = [{ id: 'fixture-review', userId: state.user.id, boothId: booth.id,
          rating: 5, content: '', createdAt: '2026-10-21T01:00:00Z' }];
      }
      navigateTo('map', { replace: true });
    }
  </script>
</body>
</html>

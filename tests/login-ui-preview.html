<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'none'; form-action 'none'" />
    <base href="../" />
    <title>Login UI isolated preview</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ui-ver2.css" />
    <link rel="stylesheet" href="web-redesign.css" />
  </head>
  <body class="design-ver2 design-web">
    <div id="app" class="app-shell"></div>
    <script>
      // Local-only visual states. No real account SDK or network access.
      const fixture = new URL(location.href).searchParams.get("fixture") || "login";
      window.FestivalCatalog = {
        CLUB_IDS: {},
        createClient: () => ({
          getSnapshot: () => ({ status: "ready", rows: [] }),
          forClub: () => null, subscribe() {}, refresh() {},
        }),
      };
      window.FestivalAccount = {
        normalizeError: error => ({ message: error.message }),
        createAccount: () => ({
          initialize: async () => {
            if (fixture === "error") throw Error("로그인을 완료하지 못했어요. 다시 시도해 주세요.");
            if (!fixture.startsWith("profile")) return null;
            return {
              id: 1, authUserId: "fixture-student", name: "김학생", googleName: "김학생",
              email: fixture === "profile-long" ? "very.long.student.account.for.layout.check@example.invalid" : "student@example.invalid",
              studentNumber: "", needsProfile: true, isAdmin: false, completedBooths: [],
            };
          },
          pending: () => fixture === "nfc" ? { token: "fixture-only" } : null,
          savePending() {},
          signIn: async () => { throw Error("로그인을 완료하지 못했어요. 다시 시도해 주세요."); },
          updateProfile: async () => { throw Error("학번을 저장하지 못했어요. 다시 시도해 주세요."); },
          signOut: async () => ({}),
        }),
      };
    </script>
    <script src="assets/vendor/ui-icons.js"></script>
    <script src="nfc-manager.js"></script>
    <script src="programs.js"></script>
    <script src="web-experience.js"></script>
    <script src="operations-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
